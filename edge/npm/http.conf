# ============================================================================
#  NPM http-level 커스텀 — nginx.conf 가 http 블록 안에서 include 한다.
#
#  설치 위치: 컨테이너의 /data/nginx/custom/http.conf
#             = 호스트의 <NPM data 디렉터리>/nginx/custom/http.conf
#  NPM 은 이 경로를 자동으로 include 한다. 파일이 없으면 만들면 된다.
#
#  ⛔ 이 파일을 빼면 vhost-searxng-advanced.conf 의 `proxy_cache sxng;` 가
#     정의되지 않은 존을 참조하게 되고, nginx 는 설정 검사에서 거부한다
#     ("sxng" zone not found) — 앞단 전체가 뜨지 않는다. 캐시를 쓰지 않으려면
#     vhost 쪽 location /search 블록도 같이 빼야 짝이 맞는다.
#
#  SearXNG 검색결과 캐시 존 (2026-11-18)
#  왜: 엔진 차단의 binding constraint 는 요청 "모양"이 아니라 IP당 질의 "수"다.
#      동일 질의를 캐시에서 돌려주면 상류(google/brave/ddg) 타격이 0 이 된다.
#      지문을 위장해 처리량을 늘리는 방향은 쓰지 않는다.
#  이 지시어는 존 정의만 한다. 실제 사용은 searxng vhost 의 Advanced 블록에서
#  `proxy_cache sxng;` 로 켠다. 다른 vhost 는 영향 없다.
# ============================================================================
proxy_cache_path /data/cache/searxng levels=1:2 keys_zone=sxng:10m
                 max_size=512m inactive=2h use_temp_path=off;
