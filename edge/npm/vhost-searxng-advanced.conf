# NPM > Proxy Hosts > searxng.systemboan.net > Advanced > Custom Nginx Configuration
#
# searxng 자체에는 인증이 없다. 이 블록이 유일한 인증이다.
# 지우면 searxng 는 무인증 공개 검색 프록시가 된다 (우리 IP 로 구글/브레이브를
# 긁어서 IP 밴까지 유발 가능).
#
# ⛔ ACME 면제 줄을 빼지 말 것.
#    nginx 의 server 레벨 `if` 는 location 선택보다 먼저(rewrite 페이즈) 실행되므로
#    `location ^~ /.well-known/acme-challenge/` 조차 못 이긴다. 예전에
#    `if ($http_x_api_key != "...") { return 403; }` 한 줄만 있었고, 그게 ACME
#    챌린지까지 403 으로 죽여서 인증서가 2026-10-18 만료되고 codemason 검색이
#    25일간 조용히 ddgs 로 폴백했다. nginx `if` 에는 && 가 없어 플래그를 쓴다.
#
# __SEARXNG_API_KEY__ 는 클라이언트의 ~/.codemason/config.json 의
# searxng_api_key 와 같은 값이어야 한다. 생성: openssl rand -hex 32

set $ok 0;
if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $ok 1; }
if ($http_x_api_key = "__SEARXNG_API_KEY__") { set $ok 1; }
if ($ok = 0) { return 403; }
