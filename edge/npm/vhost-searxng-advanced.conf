# NPM > Proxy Hosts > searxng.systemboan.net > Advanced > Custom Nginx Configuration
#
# searxng 자체에는 인증이 없다. 이 블록이 유일한 인증이다.
# 지우면 searxng 는 무인증 공개 검색 프록시가 된다 (우리 IP 로 구글/브레이브를
# 긁어서 IP 밴까지 유발 가능).
#
# ⛔ ACME 면제 줄을 빼지 말 것.
#    nginx 의 server 레벨 `if` 는 location 선택보다 먼저(rewrite 페이즈) 실행되므로
#    `location ^~ /.well-known/acme-challenge/` 조차 못 이긴다. 예전에
#    `if ($http_x_api_key != "...") { return 403; }` 한 줄만 있었고, 그게 ACME
#    챌린지까지 403 으로 죽여서 인증서가 2026-10-18 만료되고 codemason 검색이
#    25일간 조용히 ddgs 로 폴백했다. nginx `if` 에는 && 가 없어 플래그를 쓴다.
#
# __SEARXNG_API_KEY__ 는 클라이언트의 ~/.codemason/config.json 의
# searxng_api_key 와 같은 값이어야 한다. 생성: openssl rand -hex 32

#
# 2026-11-18: /search 결과 캐시 블록 추가. 존 정의는 NPM 의
#   /data/nginx/custom/http.conf (= ~/work/nginx/data/nginx/custom/http.conf).
#   정본은 NPM DB(proxy_host id=17 advanced_config) 다 — 이 파일은 사본.

set $ok 0;
if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $ok 1; }
if ($http_x_api_key = "__SEARXNG_API_KEY__") { set $ok 1; }
if ($ok = 0) { return 403; }


# ── /search 결과 캐시 (2026-11-18) ──────────────────────────────────────
# 왜: 엔진 차단의 binding constraint 는 요청 "모양"이 아니라 IP당 질의 "수" 였다.
#     실측 — 같은 IP에서 실브라우저로 google 유기적 결과 9건을 받았지만, 몇 질의
#     더 넣자 google 이 429 /sorry 에 우리 IP(<우리 공인IP>)를 적어 보여줬다.
#     brave 도 10분/15질의로 몇 시간 잠겼다. 그래서 질의 수를 줄이는 게 유일한
#     공짜 레버다. 동일 질의 재요청은 상류 타격 0.
# proxy_cache_lock: 에이전트가 같은 질의를 병렬로 던질 때 하나로 합쳐 보낸다.
# POST(웹 UI 검색)는 캐시 대상이 아니다 - GET/HEAD 만 캐시된다.
# 존 정의는 /data/nginx/custom/http.conf. 캐시 비우기:
#   docker exec nginx-proxy-manager sh -c 'rm -rf /data/cache/searxng/*' 후 reload
location /search {
  # bang(!gbr 등) 질의는 캐시하지 않는다 (2026-11-27). 3층 브라우저 레인은 유휴 후 첫
  # 질의가 콜드 기동이라 실패할 수 있는데, 그 실패가 30분 캐시돼 재시도까지 막았다.
  # bang 은 드물고 일부러 다시 찌르는 질의라 캐시 이득이 없다. q 는 인코딩돼 올 수 있다.
  set $sx_nocache 0;
  if ($arg_q ~* "^(%21|!)") { set $sx_nocache 1; }
  proxy_cache_bypass $sx_nocache;
  proxy_no_cache $sx_nocache;
  proxy_cache sxng;
  proxy_cache_key "$request_uri";
  proxy_cache_valid 200 30m;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 20s;
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
  add_header X-Cache $upstream_cache_status always;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;
  include conf.d/include/proxy.conf;
}
