# Nginx Proxy Manager (.66)
#
# 재구성:  cd /home/user/work/nginx && docker compose up -d
#
# 관리 UI(81)는 루프백만 바인딩한다. 공유기가 80/443/2222/1194 만 포워딩하도록
# 바꿨지만(2026-11-13), 포워딩은 한 줄로 되돌아갈 수 있으니 박스에서도 막는다.
# 예전 DMZ 시절 LAN IP 바인딩으로는 외부 노출이 전혀 줄지 않았다(실측).
# 접속은 SSH 터널로:
#   ssh -p 2222 -L 8081:127.0.0.1:81 user@220.85.97.203
#   -> http://localhost:8081
#
# 80/443 은 그대로 공개(모든 vhost 가 여기로 들어온다).
# 관리 UI 를 TLS vhost 로 다시 공개하지 말 것 — proxy.systemboan.net(id 1)이
# 그 짓을 하고 있었고 2026-11-13 삭제했다.

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - /home/user/work/nginx/data:/data
      - /home/user/work/nginx/letsencrypt:/etc/letsencrypt
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
